[build-system]
requires = ["scikit-build-core==0.11.6", "pybind11==3.0.1"]
build-backend = "scikit_build_core.build"

[project]
name = "frogml"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.scikit-build]
cmake.build-type = "Release"
cmake.version = "==3.28.3"
wheel.packages = ["src/python/frogml"]
